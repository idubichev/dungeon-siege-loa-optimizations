# DXVK settings used for every benchmark in this project.

# Cap presentation at 120 FPS. Lower it to your display's refresh rate if you prefer.
dxgi.maxFrameRate = 120

# Keep shader compilation synchronous (the async DXVK build's default behaviour).
dxvk.enableAsync = False

# Uncomment to show an FPS counter in the top-left corner.
# dxvk.hud = fps
